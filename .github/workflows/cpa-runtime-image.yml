name: CPA runtime image

on:
  push:
    branches: [codex/cpa-managed-auth]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cpa-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/codex/cpa-managed-auth'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Make room for the Rust and V8 build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the CPA branch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/cpa-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FORK_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/power12317/codex-cpa-runtime:cpa-managed-auth
            ghcr.io/power12317/codex-cpa-runtime:sha-${{ github.sha }}
          cache-from: type=gha,scope=cpa-runtime-amd64
          cache-to: type=gha,scope=cpa-runtime-amd64,mode=max
      - name: Record the published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          echo "### CPA runtime image" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/power12317/codex-cpa-runtime:sha-${SOURCE_REVISION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Published CPA image::ghcr.io/power12317/codex-cpa-runtime@${IMAGE_DIGEST}"
